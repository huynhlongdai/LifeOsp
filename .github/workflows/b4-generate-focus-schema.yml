name: B4 Generate Focus Schema

on:
  push:
    branches: [feat/b4-focus-v0]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/b4-focus-v0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - name: Add FocusSession schema
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/db/src/schema.ts')
          text = path.read_text()
          block = '''export const focusSessions = pgTable(
  "focus_sessions",
  {
    id: uuid("id").defaultRandom().primaryKey(),
    userId: uuid("user_id")
      .notNull()
      .references(() => users.id, { onDelete: "cascade" }),
    actionId: uuid("action_id")
      .notNull()
      .references(() => actions.id, { onDelete: "cascade" }),
    recommendationId: uuid("recommendation_id").references(() => recommendations.id, { onDelete: "set null" }),
    plannedMinutes: integer("planned_minutes"),
    status: text("status").default("active").notNull(),
    startedAt: timestamp("started_at", { withTimezone: true }).defaultNow().notNull(),
    endedAt: timestamp("ended_at", { withTimezone: true }),
    createdAt: timestamp("created_at", { withTimezone: true }).defaultNow().notNull(),
    updatedAt: timestamp("updated_at", { withTimezone: true }).defaultNow().notNull()
  },
  (table) => [
    index("focus_sessions_user_started_idx").on(table.userId, table.startedAt),
    index("focus_sessions_user_action_idx").on(table.userId, table.actionId),
    uniqueIndex("focus_sessions_one_active_per_user_uidx").on(table.userId).where(sql`${table.status} = 'active'`),
    check("focus_sessions_status_check", sql`${table.status} in ('active', 'completed', 'interrupted', 'abandoned')`),
    check(
      "focus_sessions_planned_minutes_check",
      sql`${table.plannedMinutes} is null or (${table.plannedMinutes} >= 1 and ${table.plannedMinutes} <= 480)`
    ),
    check(
      "focus_sessions_ended_at_check",
      sql`(${table.status} = 'active' and ${table.endedAt} is null) or (${table.status} <> 'active' and ${table.endedAt} is not null)`
    )
  ]
);

'''
          marker = 'export const incubatorItems = pgTable('
          if 'export const focusSessions = pgTable(' not in text:
              text = text.replace(marker, block + marker, 1)
          types = '''export type FocusSessionRow = typeof focusSessions.$inferSelect;\nexport type NewFocusSessionRow = typeof focusSessions.$inferInsert;\n'''
          marker2 = 'export type IncubatorItemRow = typeof incubatorItems.$inferSelect;'
          if 'export type FocusSessionRow =' not in text:
              text = text.replace(marker2, types + marker2, 1)
          path.write_text(text)
          PY
      - name: Generate Drizzle migration
        run: pnpm --filter @lifeos/db exec drizzle-kit generate --config=drizzle.config.ts --name=b4_focus_sessions
      - name: Commit schema and migration
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain packages/db/src/schema.ts packages/db/drizzle)" ]; then
            echo "B4 Focus schema already generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/schema.ts packages/db/drizzle
          git commit -m "feat(b4): persist canonical FocusSession state"
          git push origin HEAD:feat/b4-focus-v0
