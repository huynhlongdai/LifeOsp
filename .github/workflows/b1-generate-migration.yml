name: B1 Generate Drizzle Migration

on:
  push:
    branches: [feat/b1-action-candidate]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout B1 branch
        uses: actions/checkout@v4
        with:
          ref: feat/b1-action-candidate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Align Action schema with canonical V1
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("packages/db/src/schema.ts")
          text = path.read_text()
          if 'scheduledFor: timestamp("scheduled_for"' not in text:
              needle = '    blockedReason: text("blocked_reason"),\n'
              replacement = needle + '    scheduledFor: timestamp("scheduled_for", { withTimezone: true }),\n'
              if needle not in text:
                  raise SystemExit("Action schema patch anchor not found")
              path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Generate B1 migration delta
        run: pnpm --filter @lifeos/db exec drizzle-kit generate --config=drizzle.config.ts --name=b1_action_schedule_foundation

      - name: Commit canonical schema and generated migration
        run: |
          if git diff --quiet -- packages/db/src/schema.ts packages/db/drizzle && [ -z "$(git status --porcelain -- packages/db/src/schema.ts packages/db/drizzle)" ]; then
            echo "No schema or migration changes generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/schema.ts packages/db/drizzle
          git commit -m "db: align B1 Action schema with canonical model"
          git push origin HEAD:feat/b1-action-candidate
