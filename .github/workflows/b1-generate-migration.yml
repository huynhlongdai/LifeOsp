name: B1 Generate Drizzle Migration

on:
  push:
    branches: [feat/b1-action-candidate]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout B1 branch
        uses: actions/checkout@v4
        with:
          ref: feat/b1-action-candidate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate B1 migration
        run: pnpm --filter @lifeos/db exec drizzle-kit generate --config=drizzle.config.ts --name=b1_action_candidate

      - name: Commit generated migration
        run: |
          if git diff --quiet -- packages/db/drizzle && [ -z "$(git status --porcelain -- packages/db/drizzle)" ]; then
            echo "No migration changes generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/drizzle
          git commit -m "db: generate B1 Action candidate migration"
          git push origin HEAD:feat/b1-action-candidate
