name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: lifeos_test
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "test \"$(cat /proc/1/comm)\" = postgres && pg_isready -U lifeos -d lifeos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lifeos:lifeos_test@127.0.0.1:5432/lifeos_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify Web PWA build assets
        run: |
          test -f apps/web/dist/manifest.webmanifest
          test -f apps/web/dist/sw.js
          test -f apps/web/dist/lifeos-icon.svg
          grep -F 'rel="manifest"' apps/web/dist/index.html

      - name: API built-artifact rejects invalid environment
        run: |
          set +e
          OUTPUT=$(PORT=invalid node apps/api/dist/server.js 2>&1)
          STATUS=$?
          set -e

          echo "$OUTPUT"
          test "$STATUS" -ne 0
          echo "$OUTPUT" | grep -F "[lifeos-api] configuration error: PORT"

      - name: Verify Drizzle migration is current
        run: |
          pnpm --filter @lifeos/db exec drizzle-kit generate --config=drizzle.config.ts --name=ci_check
          git diff --exit-code -- packages/db/drizzle

      - name: Apply database migrations
        run: pnpm --filter @lifeos/db db:migrate

      - name: Database transaction integration
        run: pnpm --filter @lifeos/db test:integration

      - name: API identity integration
        run: pnpm --filter @lifeos/api test:integration

      - name: API built-artifact database readiness smoke
        run: |
          node apps/api/dist/server.js > /tmp/lifeos-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            health_ok=0
            ready_ok=0
            curl --fail --silent http://127.0.0.1:4000/health > /tmp/lifeos-health.json && health_ok=1 || true
            curl --fail --silent http://127.0.0.1:4000/ready > /tmp/lifeos-ready.json && ready_ok=1 || true

            if [ "$health_ok" -eq 1 ] && [ "$ready_ok" -eq 1 ]; then
              cat /tmp/lifeos-health.json
              cat /tmp/lifeos-ready.json
              exit 0
            fi

            sleep 1
          done

          cat /tmp/lifeos-api.log
          echo "Health response:"
          cat /tmp/lifeos-health.json 2>/dev/null || true
          echo "Readiness response:"
          cat /tmp/lifeos-ready.json 2>/dev/null || true
          exit 1

      - name: Foundation built Web to API to DB smoke
        run: pnpm foundation:smoke

      - name: Readiness fails clearly when database is unavailable
        run: |
          PORT=4101 DATABASE_URL=postgresql://lifeos:unavailable@127.0.0.1:59999/lifeos node apps/api/dist/server.js > /tmp/lifeos-degraded.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4101/health > /tmp/lifeos-degraded-health.json; then
              READY_STATUS=$(curl --silent --output /tmp/lifeos-degraded-ready.json --write-out '%{http_code}' http://127.0.0.1:4101/ready || true)
              if [ "$READY_STATUS" = "503" ]; then
                cat /tmp/lifeos-degraded-health.json
                cat /tmp/lifeos-degraded-ready.json
                grep -F '"status":"not_ready"' /tmp/lifeos-degraded-ready.json
                grep -F '"database":"failed"' /tmp/lifeos-degraded-ready.json
                exit 0
              fi
            fi
            sleep 1
          done

          cat /tmp/lifeos-degraded.log
          cat /tmp/lifeos-degraded-ready.json 2>/dev/null || true
          exit 1

      - name: Vertical Slice A survives PostgreSQL container recreation
        env:
          COMPOSE_PROJECT_NAME: lifeos-ci-vertical-slice-a
          POSTGRES_DB: lifeos_vertical_slice_a
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos_vertical_slice_a
          POSTGRES_PORT: 55433
          A5_DATABASE_URL: postgresql://lifeos:lifeos_vertical_slice_a@127.0.0.1:55433/lifeos_vertical_slice_a
        run: |
          cleanup() {
            docker compose -f compose.dev.yml down -v --remove-orphans || true
          }
          trap cleanup EXIT

          wait_for_compose_db() {
            for attempt in {1..30}; do
              CONTAINER_ID=$(docker compose -f compose.dev.yml ps -q postgres)
              HEALTH_STATUS=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER_ID" 2>/dev/null || true)
              if [ "$HEALTH_STATUS" = "healthy" ]; then
                return 0
              fi
              sleep 1
            done
            docker compose -f compose.dev.yml ps
            docker compose -f compose.dev.yml logs postgres
            return 1
          }

          docker compose -f compose.dev.yml up -d postgres
          wait_for_compose_db
          DATABASE_URL="$A5_DATABASE_URL" pnpm --filter @lifeos/db db:migrate
          DATABASE_URL="$A5_DATABASE_URL" pnpm --filter @lifeos/api exec tsx src/vertical-slice-a-container.smoke.ts

      - name: PostgreSQL named volume survives container recreation
        env:
          COMPOSE_PROJECT_NAME: lifeos-ci-persistence
          POSTGRES_DB: lifeos_persistence
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos_persistence
          POSTGRES_PORT: 55432
        run: |
          cleanup() {
            docker compose -f compose.dev.yml down -v --remove-orphans || true
          }
          trap cleanup EXIT

          wait_for_compose_db() {
            for attempt in {1..30}; do
              CONTAINER_ID=$(docker compose -f compose.dev.yml ps -q postgres)
              HEALTH_STATUS=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER_ID" 2>/dev/null || true)
              if [ "$HEALTH_STATUS" = "healthy" ]; then
                return 0
              fi
              sleep 1
            done
            docker compose -f compose.dev.yml ps
            docker compose -f compose.dev.yml logs postgres
            return 1
          }

          docker compose -f compose.dev.yml up -d postgres
          wait_for_compose_db

          docker compose -f compose.dev.yml exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c \
            "create table if not exists ci_persistence_probe (id integer primary key, value text not null); insert into ci_persistence_probe (id, value) values (1, 'survives-recreate') on conflict (id) do update set value = excluded.value;"

          docker compose -f compose.dev.yml stop postgres
          docker compose -f compose.dev.yml rm -f postgres
          docker compose -f compose.dev.yml up -d postgres
          wait_for_compose_db

          VALUE=$(docker compose -f compose.dev.yml exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "select value from ci_persistence_probe where id = 1")
          test "$VALUE" = "survives-recreate"
          echo "PostgreSQL named-volume persistence verified: $VALUE"
