name: Migration Debug

on:
  pull_request:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - name: Generate and print migration artifacts
        run: |
          pnpm --filter @lifeos/db exec drizzle-kit generate --config=drizzle.config.ts --name=ci_check
          echo '===SQL===' 
          cat packages/db/drizzle/0003_ci_check.sql
          echo '===SNAPSHOT===' 
          cat packages/db/drizzle/meta/0003_snapshot.json
          echo '===JOURNAL===' 
          cat packages/db/drizzle/meta/_journal.json
