name: A4 Harden Confirm

on:
  push:
    branches: [feat/a4-clarity-promotion]
    paths: [.github/workflows/a4-harden-confirm.yml]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/a4-clarity-promotion
      - name: Harden prepared trade-off provenance and fix Web narrowing
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('packages/db/src/promotion.ts')
          s = p.read_text()
          old = '''  season: {\n    title: string;\n    purpose: string;\n    primaryFocusText?: string;\n    startsOn?: string;\n    targetEndsOn?: string;\n  };\n  notNowItems: PromotionNotNowItem[];\n};'''
          new = '''  season: {\n    title: string;\n    purpose: string;\n    primaryFocusText?: string;\n    startsOn?: string;\n    targetEndsOn?: string;\n  };\n};'''
          if old not in s:
              raise SystemExit('Finalize params block not found')
          s = s.replace(old, new, 1)
          marker = 'export async function confirmClarityPromotion'
          before, after = s.split(marker, 1)
          after = after.replace('params.notNowItems', 'payload.notNowItems')
          p.write_text(before + marker + after)

          p = Path('apps/api/src/promotion.ts')
          s = p.read_text()
          s = s.replace('type FinalPromotionInput = Pick<ClarityPromotionDraftInput, "direction" | "season" | "notNowItems">;', 'type FinalPromotionInput = Pick<ClarityPromotionDraftInput, "direction" | "season">;')
          s = s.replace('''        direction: parsed.direction,\n        season: parsed.season,\n        notNowItems: parsed.notNowItems\n''', '''        direction: parsed.direction,\n        season: parsed.season\n''')
          old = '''function parseFinalPromotionInput(value: unknown): FinalPromotionInput | null {\n  if (!isRecord(value)) return null;\n  if (Object.keys(value).some((key) => key !== "direction" && key !== "season" && key !== "notNowItems")) return null;\n  const direction = parseDirection(value.direction);\n  const season = parseSeason(value.season);\n  const notNowItems = parseNotNowItems(value.notNowItems);\n  if (!direction || !season || !notNowItems || notNowItems.length > MAX_TRADE_OFF_ITEMS) return null;\n  return { direction, season, notNowItems };\n}'''
          new = '''function parseFinalPromotionInput(value: unknown): FinalPromotionInput | null {\n  if (!isRecord(value)) return null;\n  if (Object.keys(value).some((key) => key !== "direction" && key !== "season")) return null;\n  const direction = parseDirection(value.direction);\n  const season = parseSeason(value.season);\n  if (!direction || !season) return null;\n  return { direction, season };\n}'''
          if old not in s:
              raise SystemExit('Final API parser block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('apps/web/src/api.ts')
          s = p.read_text()
          s = s.replace('export type FinalPromotionInput = Pick<ClarityPromotionDraftInput, "direction" | "season" | "notNowItems">;', 'export type FinalPromotionInput = Pick<ClarityPromotionDraftInput, "direction" | "season">;')
          old = '''function isPromotionConfirmedView(value: unknown): value is PromotionConfirmedView {\n  return (\n    isCurrentDirectionView(value) &&\n    Array.isArray(value.incubatorItems) &&\n    value.incubatorItems.every(isIncubatorItemView)\n  );\n}'''
          new = '''function isPromotionConfirmedView(value: unknown): value is PromotionConfirmedView {\n  return (\n    isRecord(value) &&\n    isDirectionView(value.direction) &&\n    isSeasonView(value.season) &&\n    Array.isArray(value.incubatorItems) &&\n    value.incubatorItems.every(isIncubatorItemView)\n  );\n}'''
          if old not in s:
              raise SystemExit('Promotion validator block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('apps/web/src/ClarityPromotion.tsx')
          s = p.read_text()
          old = '''        },\n        notNowItems: notNow.map((candidate) => ({\n          text: candidate.text,\n          kind: incubatorKinds[candidate.text] ?? candidate.defaultIncubatorKind\n        }))\n      });'''
          if old not in s:
              raise SystemExit('Web confirm Not Now block not found')
          p.write_text(s.replace(old, '''        }\n      });''', 1))

          p = Path('apps/api/src/promotion.integration.ts')
          s = p.read_text()
          s = s.replace('        notNowItems: [{ text: "AOP", kind: "project_candidate" }]\n', '')
          s = s.replace('        notNowItems: []\n', '')
          p.write_text(s)

          p = Path('apps/web/src/promotion-api.test.ts')
          s = p.read_text().replace('      notNowItems: input.notNowItems\n', '')
          p.write_text(s)
          PY
          git rm .github/workflows/a4-harden-confirm.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/promotion.ts apps/api/src/promotion.ts apps/api/src/promotion.integration.ts apps/web/src/api.ts apps/web/src/ClarityPromotion.tsx apps/web/src/promotion-api.test.ts
          git commit -m "Harden A4 confirm provenance and Web response validation"
          git push origin HEAD:feat/a4-clarity-promotion
