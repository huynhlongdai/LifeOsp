name: A4 Normalize CSS

on:
  push:
    branches: [feat/a4-clarity-promotion]
    paths: [.github/workflows/a4-normalize-css.yml]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/a4-clarity-promotion
      - name: Replace literal escaped newlines
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/styles.css')
          s = p.read_text()
          s = s.replace(r'\n', '\n')
          p.write_text(s)
          if r'\n' in s:
              raise SystemExit('literal escaped newline still present in CSS')
          PY
          git rm .github/workflows/a4-normalize-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/styles.css
          git commit -m "Normalize A4 stylesheet source"
          git push origin HEAD:feat/a4-clarity-promotion
