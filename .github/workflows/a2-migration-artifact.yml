name: A2 Migration Artifact

on:
  push:
    branches: [feat/a2-interpretation-contract]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate and print A2 migration artifacts
        run: |
          pnpm --filter @lifeos/db exec drizzle-kit generate --config=drizzle.config.ts --name=interpretation_contract
          echo '--- GENERATED SQL ---'
          cat packages/db/drizzle/0003_interpretation_contract.sql
          echo '--- GENERATED SNAPSHOT ---'
          cat packages/db/drizzle/meta/0003_snapshot.json
          echo '--- GENERATED JOURNAL ---'
          cat packages/db/drizzle/meta/_journal.json
